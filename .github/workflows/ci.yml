name: Validate

on:
  push:
  pull_request:

jobs:
  backend-and-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: peopleops
          POSTGRES_PASSWORD: peopleops
          POSTGRES_DB: peopleops_decision_lab_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U peopleops -d peopleops_decision_lab_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://peopleops:peopleops@127.0.0.1:5432/peopleops_decision_lab_ci
      M2_TEST_DATABASE_URL: postgresql+psycopg://peopleops:peopleops@127.0.0.1:5432/peopleops_decision_lab_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Prove fresh migration, seed, and backend regression suite
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m api.seed
          python -m pytest -q
      - name: Install frontend dependencies and Chromium
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Exercise live browser critical flows
        run: |
          python -m uvicorn api.app.main:app --host 127.0.0.1 --port 8000 > /tmp/peopleops-api.log 2>&1 &
          (cd web && npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/peopleops-web.log 2>&1 &)
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:8000/health && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:8000/health
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:5173/ > /dev/null && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:5173/ > /dev/null
          (cd web && npm run e2e)
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install deterministic frontend dependencies
        working-directory: web
        run: npm ci
      - name: Run frontend unit tests and type check
        working-directory: web
        run: |
          npm test
          npm run typecheck
      - name: Build production frontend
        working-directory: web
        run: npm run build
