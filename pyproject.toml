[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peopleops-decision-lab"
version = "0.1.0"
description = "M1 workforce planning forecast and optimization proof of concept"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "ortools>=9.10,<9.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
peopleops-demo = "peopleops.demo:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
