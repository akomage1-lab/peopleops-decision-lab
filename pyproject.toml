[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peopleops-decision-lab"
version = "0.1.0"
description = "M1 workforce planning forecast and optimization proof of concept"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.13,<1.15",
    "fastapi>=0.115,<0.116",
    "ortools>=9.10,<9.12",
    "psycopg[binary]>=3.2,<3.3",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.30,<0.31",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<0.29",
    "pytest>=8.0",
]

[project.scripts]
peopleops-demo = "peopleops.demo:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
